<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Outer Red Ring -->
  <circle cx="150" cy="150" r="142" fill="#c52222" stroke="#8b1818" stroke-width="4"/>
  <circle cx="150" cy="150" r="128" fill="#ffffff" stroke="#c52222" stroke-width="2"/>
  
  <!-- Outer Text Circular Path -->
  <path id="textCircleTop" d="M 40,150 A 110,110 0 1,1 260,150" fill="none"/>
  <path id="textCircleBottom" d="M 260,150 A 110,110 0 0,1 40,150" fill="none"/>
  
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="900" fill="#c52222" letter-spacing="2">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">SOUTHERN ISABELA ACADEMY</textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="800" fill="#c52222" letter-spacing="2">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">★ SAN GUILLERMO, ISABELA ★</textPath>
  </text>
  
  <!-- Inner Green Laurel Ring -->
  <circle cx="150" cy="150" r="96" fill="#fcf8f8" stroke="#15803d" stroke-width="3"/>
  
  <!-- Center Shield & Torch/Book Symbol -->
  <path d="M 115 105 L 185 105 L 185 160 C 185 185 150 205 150 205 C 150 205 115 185 115 160 Z" fill="#1e3a8a" stroke="#fbbf24" stroke-width="3"/>
  
  <!-- Open Book inside Shield -->
  <path d="M 125 155 Q 150 145 150 165 Q 150 145 175 155 L 175 175 Q 150 165 150 185 Q 150 165 125 175 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Flaming Torch of Knowledge -->
  <path d="M 150 115 L 150 150" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <!-- Flame -->
  <path d="M 150 100 Q 158 112 150 122 Q 142 112 150 100 Z" fill="#dc2626"/>
  <path d="M 150 105 Q 154 113 150 119 Q 146 113 150 105 Z" fill="#fbbf24"/>
  
  <!-- Laurel Leaves Outline -->
  <path d="M 98 150 C 98 120 115 95 140 85" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
  <path d="M 202 150 C 202 120 185 95 160 85" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
  <path d="M 98 150 C 98 180 115 205 140 215" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
  <path d="M 202 150 C 202 180 185 205 160 215" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
</svg>